name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Playwright 1.56(책자 PDF)이 지원하는 우분투로 고정. ubuntu-latest(26.04)는 아직 지원하지 않는다
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install segno==1.6.6 openpyxl==3.1.5 cryptography==44.0.0
      - run: python planner/check_trip.py
      - run: python planner/build.py
      # 엑셀·PDF는 실패해도 사이트 배포는 계속한다 (책자 화면에서 바로 인쇄할 수 있음)
      - name: 엑셀 일정표
        run: python planner/export.py
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: PDF 여행 책자
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node planner/tools/render-pdf.js
      # SITE_PASSWORD가 없으면 배포 아티팩트를 만들지 않는다
      - name: 비밀번호 잠금
        env:
          REQUIRE_SITE_PASSWORD: "1"
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python planner/lock.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
