<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="후쿠오카 타워 일러스트">
  <!-- 여행 플래너 자체 제작: 해 질 녘 모모치 해변의 후쿠오카 타워. 어두운 화면에서는 밤 풍경 -->
  <style>
    .s0{stop-color:#5b7fc4}.s1{stop-color:#a9bfe6}.s2{stop-color:#f4c9b4}.s3{stop-color:#f9e2c8}
    .far{fill:#8ea3cf;opacity:.55}.mid{fill:#5f74a8;opacity:.8}.near{fill:#2f3f6b}
    .g0{stop-color:#3b5590}.g1{stop-color:#9fb8e8}.g2{stop-color:#4a64a0}
    .sea0{stop-color:#46639f}.sea1{stop-color:#253660}
    .glow{fill:#fff3dc;opacity:.9}.halo{fill:#ffe1c2;opacity:.35}
    .lit{fill:#ffd9a8;opacity:0}.ref{stroke:#f7d6bd;opacity:.45}
    @media (prefers-color-scheme: dark){
      .s0{stop-color:#0b1430}.s1{stop-color:#1c2c5c}.s2{stop-color:#3d3f78}.s3{stop-color:#5b4a7e}
      .far{fill:#2a3a6a;opacity:.7}.mid{fill:#1c2850;opacity:.9}.near{fill:#0d1530}
      .g0{stop-color:#1d2d58}.g1{stop-color:#6f8fd8}.g2{stop-color:#22346a}
      .sea0{stop-color:#18244a}.sea1{stop-color:#070c1e}
      .glow{fill:#e9edff;opacity:.85}.halo{fill:#9fb0ff;opacity:.18}
      .lit{opacity:.9}.ref{stroke:#9fb6ff;opacity:.4}
    }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="s0"/><stop offset=".45" class="s1"/><stop offset=".8" class="s2"/><stop offset="1" class="s3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="g0"/><stop offset=".55" class="g1"/><stop offset="1" class="g2"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="sea0"/><stop offset="1" class="sea1"/>
    </linearGradient>
    <radialGradient id="haze" cx=".72" cy=".62" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="250" fill="url(#sky)"/>
  <rect width="400" height="250" fill="url(#haze)"/>
  <!-- 해(밤에는 달) -->
  <circle cx="292" cy="142" r="30" class="halo"/>
  <circle cx="292" cy="142" r="15" class="glow"/>
  <!-- 먼 산 -->
  <path class="far" d="M0 176 C40 160 70 166 104 156 S170 150 210 160 S300 150 340 158 S385 164 400 160 V200 H0 Z"/>
  <!-- 중간 도시 -->
  <path class="mid" d="M0 200 V184 h14 v-8 h12 v10 h10 v-16 h16 v20 h8 v-12 h18 v12 h10 v-22 h14 v22 h8 v-8 h12 v8
    H190 V200 Z M210 200 V186 h32 v-14 h16 v14 h8 v-24 h14 v24 h10 v-10 h12 v10 h10 v-18 h16 v18 h10 v-8 h14 v8 h14 v-12 h14 V200 Z"/>
  <!-- 후쿠오카 타워 -->
  <rect x="199.2" y="34" width="1.6" height="30" rx=".8" class="near"/>
  <circle cx="200" cy="33" r="1.6" fill="#ff8a80"/>
  <path d="M192 64 H208 L214 204 H186 Z" fill="url(#glass)"/>
  <path d="M200 64 V204" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.2"/>
  <rect x="189" y="66" width="22" height="9" rx="2.5" class="near"/>
  <rect x="191" y="69" width="18" height="2" rx="1" class="lit"/>
  <g class="lit"><rect x="198" y="90" width="4" height="100" rx="2" opacity=".35"/></g>
  <!-- 가까운 해안선 -->
  <path class="near" d="M0 204 H400 V210 H0 Z"/>
  <path class="near" d="M150 204 h20 v-6 h16 v6 Z M228 204 v-5 h14 v-4 h22 v9 Z"/>
  <!-- 바다 -->
  <rect y="210" width="400" height="40" fill="url(#sea)"/>
  <g class="ref" stroke-width="2" stroke-linecap="round">
    <path d="M200 216 h0"/><path d="M194 220 h12"/><path d="M190 226 h20"/><path d="M196 232 h8"/>
    <path d="M280 218 h24"/><path d="M286 224 h12"/>
  </g>
</svg>
